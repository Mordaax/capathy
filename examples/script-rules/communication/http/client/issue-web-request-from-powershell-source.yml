rule:
  meta:
    name: issue web request from PowerShell source
    namespace: communication/http/client
    authors:
      - capa contributors
    description: Demonstration source rule; requires a direct Invoke-WebRequest command.
    scopes:
      static: statement
      dynamic: unsupported
    examples:
      - 49d2ba3d06cf856b9d880724111abd33375dc6abb8edbf5a071168e0b57e2255:0x3A
  features:
    - and:
      - format: powershell
      - script-call: invoke-webrequest
