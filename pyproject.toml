[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capathy"
version = "0.1.0"
description = "Go script analysis and evidence-grounded rule tooling, with optional capa integration"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE.txt"}
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
capathy = "capathy.__main__:main"

[tool.setuptools.packages.find]
include = ["capathy"]
namespaces = false

[tool.setuptools.package-data]
capathy = ["integrations/capa/manifest.json", "integrations/capa/patches/*.patch", "integrations/capa/overlay/**/*.py", "integrations/capa/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["capathy/integrations/capa/overlay"]
